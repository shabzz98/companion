name: OPL Calendar Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - opl-selfhosted
    paths:
      - "apps/mobile/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/opl-android-apk.yml"

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate and build standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
      EXPO_PUBLIC_CALCOM_SELF_HOSTED_APP_URL: https://calendar.oceanportlink.com
      EXPO_PUBLIC_CALCOM_SELF_HOSTED_API_V2_URL: https://calendar.oceanportlink.com/api/v2
      EXPO_PUBLIC_CALCOM_OAUTH_CLIENT_ID: 0d61b02d56d2065931e0450afb7777535815bc36052fa909422a50ec840a6871
      EXPO_PUBLIC_CALCOM_OAUTH_REDIRECT_URI: opl-calendar://oauth/callback

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Adapt OAuth scopes for Cal.diy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/mobile/services/oauthService.ts")
          text = path.read_text()
          hosted = (
              '"EVENT_TYPE_READ EVENT_TYPE_WRITE BOOKING_READ BOOKING_WRITE '
              'PROFILE_READ PROFILE_WRITE SCHEDULE_READ SCHEDULE_WRITE";'
          )
          # Cal.diy's web OAuth authorize page parses the `scope` query param
          # using comma separation (scope.split(",")), unlike hosted Cal.com.
          self_hosted = '"READ_BOOKING,READ_PROFILE";'
          if hosted not in text:
              raise SystemExit("Expected hosted Cal.com OAuth scope string was not found")
          path.write_text(text.replace(hosted, self_hosted, 1))
          PY

      - name: Type check mobile app
        run: bun --filter mobile typecheck

      - name: Validate self-hosted build configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_PUBLIC_CALCOM_SELF_HOSTED_APP_URL"
          test -n "$EXPO_PUBLIC_CALCOM_SELF_HOSTED_API_V2_URL"
          test -n "$EXPO_PUBLIC_CALCOM_OAUTH_CLIENT_ID"
          test "$EXPO_PUBLIC_CALCOM_OAUTH_REDIRECT_URI" = "opl-calendar://oauth/callback"

      - name: Create CI Google services file
        working-directory: apps/mobile
        run: |
          cat > google-services.ci.json <<'JSON'
          {
            "project_info": {
              "project_number": "1",
              "project_id": "opl-calendar-ci",
              "storage_bucket": "opl-calendar-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1:android:oplcalendar",
                  "android_client_info": {
                    "package_name": "com.oceanportlink.calendar"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "ci" }],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          echo "GOOGLE_SERVICES_JSON=./google-services.ci.json" >> "$GITHUB_ENV"

      - name: Generate Android project
        working-directory: apps/mobile
        run: EXPO_NO_GIT_STATUS=1 bunx expo prebuild --platform android --no-install --clean

      - name: Build standalone release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload OPL Calendar standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: opl-calendar-standalone-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
